# Bastion reviewer registry. No reviewers are active: `bastion review` passes
# trivially until a project adds its own. Every reviewer is a paid agent run,
# so add one only for a semantic invariant that a Nudge rule cannot express.
#
# Suggested starting shape. Uncomment and adjust when the project has code:
#
# attestations: true
#
# defaults:
#   model: gpt-5.6-luna
#   effort: xhigh
#
# reviewers:
#   - name: fresh-eyes-correctness
#     trigger: ['**']
#     mode: gate
#     backend: codex
#     prompt: |
#       Read the commit messages to understand the intended change. Review the
#       complete changeset and the relevant surrounding code and tests for
#       correctness. Find concrete bugs, regressions, missed edge cases, unsafe
#       assumptions, and behavior that conflicts with the stated intent. Report
#       only actionable correctness findings supported by the code. Do not flag
#       style preferences, optional improvements, or speculative risks. Pass when
#       the change is correct.
#
#   - name: simplicity
#     trigger: ['**']
#     mode: gate
#     backend: codex
#     prompt: |
#       Review the changes for unnecessary complexity. Find abstractions,
#       indirection, configuration, fallbacks, compatibility layers, or
#       generalized machinery that lack a current requirement or an observed
#       failure. Prefer deleting code, using an existing mechanism, or
#       implementing the direct solution. Report only concrete simplifications
#       that preserve the stated intent and required behavior. Pass when the
#       change is as simple as its requirements allow.
#
# Narrow, single-concern reviewers scale better than broad ones. Examples a
# derived project might add: a decoder exists at each new external boundary;
# a migration is expand-and-contract safe; a release matrix change updates the
# installers. Trigger each on the paths it governs, not on '**'.
reviewers: []
