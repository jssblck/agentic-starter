name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: bun run ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Nudge
        run: curl -sSfL https://raw.githubusercontent.com/attunehq/nudge/main/scripts/install.sh | bash
      - name: Install Bastion
        run: curl -sSfL https://raw.githubusercontent.com/jssblck/bastion/main/scripts/install.sh | bash
      - name: Install eph
        run: curl -sSfL https://raw.githubusercontent.com/attunehq/doteph/main/scripts/install.sh | bash
      - run: bun install --frozen-lockfile
      - run: bun run ci
