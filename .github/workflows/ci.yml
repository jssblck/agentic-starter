name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: pnpm run ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Nudge
        run: curl -sSfL https://raw.githubusercontent.com/attunehq/nudge/main/scripts/install.sh | bash
      - name: Install Bastion
        run: curl -sSfL https://raw.githubusercontent.com/jssblck/bastion/main/scripts/install.sh | bash
      - name: Install eph
        run: curl -sSfL https://raw.githubusercontent.com/attunehq/doteph/main/scripts/install.sh | bash
      - name: Install sops
        run: |
          curl -sSfL -o /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          chmod 755 /usr/local/bin/sops
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
