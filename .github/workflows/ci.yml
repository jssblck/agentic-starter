name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript, API, and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:web
      - run: bun run openapi:export
      - run: bun run version:check
      - run: bun run release:check
      - name: Reject edits to committed migrations
        if: github.event_name == 'pull_request'
        run: bun run db:migrations:check -- --base "${{ github.event.pull_request.base.sha }}"

  rust:
    name: Rust library
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace

  policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Nudge
        run: curl -sSfL https://raw.githubusercontent.com/attunehq/nudge/main/scripts/install.sh | bash
      - name: Install Bastion
        run: curl -sSfL https://raw.githubusercontent.com/jssblck/bastion/main/scripts/install.sh | bash
      - name: Install eph
        run: curl -sSfL https://raw.githubusercontent.com/attunehq/doteph/main/scripts/install.sh | bash
      - run: nudge validate
      - run: nudge check
      - run: bastion validate
      - run: eph check

  integration:
    name: Native addon and Postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://todo:todo@localhost:5432/todo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run native:ensure
      - run: bun run db:migrate
      - run: bun run test:integration
      - name: Smoke-test the CLI against the server
        run: |
          bun apps/server/src/main.ts >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat server.log
            exit 1
          fi
          TODO_API_URL=http://localhost:3000 bun apps/cli/src/main.ts add "CI todo @actions #smoke !high"
          TODO_API_URL=http://localhost:3000 bun apps/cli/src/main.ts list
