name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Tag must look like v0.1.0" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  binaries:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target_name: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            triple: x86_64-unknown-linux-gnu
            executable: todoctl
            format: tar
          - runner: ubuntu-24.04-arm
            target_name: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            triple: aarch64-unknown-linux-gnu
            executable: todoctl
            format: tar
          - runner: macos-15-intel
            target_name: macos-x64
            rust_target: x86_64-apple-darwin
            triple: x86_64-apple-darwin
            executable: todoctl
            format: tar
          - runner: macos-15
            target_name: macos-arm64
            rust_target: aarch64-apple-darwin
            triple: aarch64-apple-darwin
            executable: todoctl
            format: tar
          - runner: windows-2025
            target_name: windows-x64
            rust_target: x86_64-pc-windows-msvc
            triple: x86_64-pc-windows-msvc
            executable: todoctl.exe
            format: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      PROJECT_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.rust_target }}
      - run: bun install --frozen-lockfile
      - run: bun tools/write-version.ts --version "$PROJECT_VERSION"
      - run: bun tools/build-cli.ts --target "${{ matrix.target_name }}" --out-dir dist/bin
      - name: Smoke test executable
        run: 'dist/bin/${{ matrix.executable }} --version'
      - name: Package archive
        run: |
          set -euo pipefail
          stem="todoctl-${{ matrix.triple }}"
          mkdir -p "dist/package/$stem"
          cp "dist/bin/${{ matrix.executable }}" "dist/package/$stem/${{ matrix.executable }}"
          cp README.md LICENSE NOTICE "dist/package/$stem/"
          cd dist/package
          if [ "${{ matrix.format }}" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -LiteralPath '$stem' -DestinationPath '$stem.zip' -Force"
          else
            tar -czf "$stem.tar.gz" "$stem"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: todoctl-${{ matrix.triple }}
          path: dist/package/todoctl-${{ matrix.triple }}.*
          if-no-files-found: error

  container:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PROJECT_VERSION=${{ needs.prepare.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Record image provenance in GitHub
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  github-release:
    needs: [prepare, binaries, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Add installers and create checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 artifacts/
          cd artifacts
          sha256sum todoctl-* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --verify-tag \
            --generate-notes \
            --title "todoctl ${{ needs.prepare.outputs.version }}"
