version: 1

rules:
  - name: typescript-no-any
    description: Keep unknown data unknown until a boundary decoder proves its shape
    message: 'Replace `any` with `unknown`, a generic, or a concrete type, then narrow it before use.'
    on:
      - hook: PreToolUse
        tool: Write
        file: '**/*.ts'
        content:
          - kind: SyntaxTree
            language: typescript
            query: |
              ((predefined_type) @type
                (#eq? @type "any"))
      - hook: PreToolUse
        tool: Edit
        file: '**/*.ts'
        new_content:
          - kind: SyntaxTree
            language: typescript
            query: |
              ((predefined_type) @type
                (#eq? @type "any"))

  - name: typescript-no-non-null-assertion
    description: Make missing values explicit instead of suppressing the checker
    message: 'Replace the non-null assertion with a guard, optional chaining, or a decoder that proves the value exists.'
    on:
      - hook: PreToolUse
        tool: Write
        file: '**/*.ts'
        content:
          - kind: SyntaxTree
            language: typescript
            query: |
              ((non_null_expression) @assertion
                (#match? @assertion "!$"))
      - hook: PreToolUse
        tool: Edit
        file: '**/*.ts'
        new_content:
          - kind: SyntaxTree
            language: typescript
            query: |
              ((non_null_expression) @assertion
                (#match? @assertion "!$"))

  - name: typescript-no-checker-suppression
    description: Do not silence TypeScript diagnostics
    message: 'Remove the TypeScript suppression and model or narrow the value correctly.'
    on:
      - hook: PreToolUse
        tool: Write
        file: '**/*.ts'
        content:
          - kind: Regex
            pattern: '@ts-(?:ignore|nocheck|expect-error)'
      - hook: PreToolUse
        tool: Edit
        file: '**/*.ts'
        new_content:
          - kind: Regex
            pattern: '@ts-(?:ignore|nocheck|expect-error)'

  - name: typescript-no-double-cast
    description: Double assertions erase the evidence the type checker is supposed to provide
    message: 'Replace the double assertion with a runtime decoder, type guard, or correctly typed boundary adapter.'
    on:
      - hook: PreToolUse
        tool: Write
        file: '**/*.ts'
        content:
          - kind: Regex
            pattern: "\\bas\\s+unknown\\s+as\\b"
      - hook: PreToolUse
        tool: Edit
        file: '**/*.ts'
        new_content:
          - kind: Regex
            pattern: "\\bas\\s+unknown\\s+as\\b"

  - name: worktree-no-fixed-port
    description: Let eph assign a distinct port to every worktree run service
    message: 'Use `port=auto` for `run=` services; fixed development ports collide across worktrees.'
    on:
      - hook: PreToolUse
        tool: Write
        file: '.eph'
        content:
          - kind: Regex
            pattern: '(?m)^run=.+\n(?:[^\n\[]+\n)*port=[0-9]+$'
      - hook: PreToolUse
        tool: Edit
        file: '.eph'
        new_content:
          - kind: Regex
            pattern: '(?m)^run=.+\n(?:[^\n\[]+\n)*port=[0-9]+$'

  - name: secrets-no-plaintext-age-identity
    description: Age private keys belong in the user key file, .age/elevated, or a platform variable, never in a tracked file
    message: 'Do not write an age private key into the repository. Put it in ~/.config/sops/age/keys.txt, pipe it to `pnpm secrets elevate`, or set SOPS_AGE_KEY on the platform. See docs/secrets.md.'
    on:
      - hook: PreToolUse
        tool: Write
        file: '**/*'
        content:
          - kind: Regex
            pattern: 'AGE-SECRET-KEY-1[0-9A-Z]{20,}'
      - hook: PreToolUse
        tool: Edit
        file: '**/*'
        new_content:
          - kind: Regex
            pattern: 'AGE-SECRET-KEY-1[0-9A-Z]{20,}'

  - name: use-pnpm-run
    description: Keep one JavaScript package-manager surface
    action: substitute
    on:
      - hook: PreToolUse
        tool: Bash
        command:
          - kind: Regex
            pattern: '^(?:npm|yarn|bun) run (?P<script>.+)$'
            replace: 'pnpm run {{ $script }}'

  - name: use-pnpm-dlx
    description: Use pnpm's package runner
    action: substitute
    on:
      - hook: PreToolUse
        tool: Bash
        command:
          - kind: Regex
            pattern: '^(?:npx|bunx) (?P<command>.+)$'
            replace: 'pnpm dlx {{ $command }}'

  - name: use-pnpm-install
    description: Keep one JavaScript package-manager surface
    action: substitute
    on:
      - hook: PreToolUse
        tool: Bash
        command:
          - kind: Regex
            pattern: '^(?:npm|yarn|bun) (?P<verb>install|add|remove|i)(?P<rest>.*)$'
            replace: 'pnpm {{ $verb }}{{ $rest }}'
