[workspace]
resolver = "3"
members = ["crates/todo-parser", "crates/todo-parser-napi"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"
repository = "https://github.com/your-org/agentic-starter"

[workspace.dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-build = "2"
napi-derive = "3"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
