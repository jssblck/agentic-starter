version = 1
name = "agentic-starter"

[setup]
script = '''
git fetch --force origin refs/heads/main:refs/remotes/origin/main
git rebase origin/main
bun install --frozen-lockfile
eph up --role dep
'''

[cleanup]
script = "eph clean"

[[actions]]
name = "Dev"
icon = "run"
command = "eph up"

[[actions]]
name = "Check"
icon = "tool"
command = "bun run check"
