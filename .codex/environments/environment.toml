version = 1
name = "agentic-starter"

[setup]
script = '''
git fetch --force origin refs/heads/main:refs/remotes/origin/main
pnpm install --frozen-lockfile
eph up
'''

[cleanup]
script = "eph clean"

[[actions]]
name = "Dev"
icon = "run"
command = "eph up"

[[actions]]
name = "Check"
icon = "tool"
command = "pnpm run check"
