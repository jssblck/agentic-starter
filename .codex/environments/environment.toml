version = 1
name = "agentic-starter"

[setup]
script = '''
git fetch --force origin refs/heads/main:refs/remotes/origin/main
command -v sops >/dev/null || {
  curl -sSfL -o /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
  chmod 755 /usr/local/bin/sops
}
pnpm install --frozen-lockfile
eph up
'''

[cleanup]
script = "eph clean"

[[actions]]
name = "Dev"
icon = "run"
command = "eph up"

[[actions]]
name = "Check"
icon = "tool"
command = "pnpm run check"
